name: Windows shadow ACL baseline probe
on:
  push:
    branches: [validation/112-windows-acl-probe]
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check that legacy explicit Everyone access is removed
        shell: pwsh
        run: ./test/windows-acl-probe/probe.ps1
