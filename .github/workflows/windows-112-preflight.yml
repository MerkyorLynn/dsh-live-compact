name: Windows 1.1.2 environment preflight
on:
  push:
    branches: [validation/112-windows-preflight]
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm ordinary user and official installer
        shell: pwsh
        run: ./test/windows-preflight/preflight.ps1
