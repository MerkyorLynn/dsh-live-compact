# Host stock stays disabled so this engine can register ctx.compaction.
# The entry installs its preset listener before constructing the engine.
# takeoverPresets controls future preset loads, not existing session engines.
- id: compaction-basic
  disabled: true
- insert:
    - id: compaction-spine
      name: dsh-live-compact
      config:
        takeoverPresets: true
        auto: true
        # These three values are also copied onto the web preset engine by gate.js.
        thresholdRatio: 0.8
        headroomTokens: 65536
        retainTokens: 8192
        compactionRetries: 0


